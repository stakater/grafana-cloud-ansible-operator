# Build the alertmanager config the operator ships.
#
# Base config:
# - standalone: this cluster's own alertmanager-main, so whatever else is in it
#   (receivers, routes, inhibit rules added by hand or by other tools) is kept.
# - hubAndSpoke: a fixed base (grafana_cloud_operator_spoke_alertmanager_base),
#   not the hub's secret. The hub's config used to be copied into every spoke,
#   including anything hub-specific in `global` (credentials, http_config).
#
# Merge: receivers and child routes are merged by name, not replaced. The
# operator's own entries (matched by receiver name) are replaced on every run, so
# re-runs are idempotent. Existing child routes with `continue: true` (e.g.
# kube-ward's catch-all) stay first so they still see every alert; the
# operator's named routes come next, so its Watchdog -> heartbeat route wins
# over any existing Watchdog route; all other existing routes follow; the
# operator's catch-all route to OnCall is last, so every alert reaches Grafana
# Cloud. The root receiver alone is not enough: Alertmanager only uses it when
# no child route matched, and a `continue: true` catch-all always matches.
- name: Select the base alertmanager configuration
  ansible.builtin.set_fact:
    grafana_cloud_operator_alertmanager_base: >-
      {{ grafana_cloud_operator_spoke_alertmanager_base
         if provision_mode == "hubAndSpoke"
         else (grafana_cloud_operator_fetched_alertmanager_secrets.resources[0].data['alertmanager.yaml'] | b64decode | from_yaml) }}

- name: Define the receivers and routes the operator owns
  ansible.builtin.set_fact:
    grafana_cloud_operator_own_receivers: >-
      {{ [
            {
              "name": receiver_name | trim,
              "webhook_configs": [
                {
                  "url": receiver_url,
                  "send_resolved": true,
                }
              ]
            },
            {
              "name": "grafana-oncall-heartbeat",
              "webhook_configs": [
                {
                  "url": receiver_url + "heartbeat/",
                  "send_resolved": false,
                }
              ]
            }
          ] }}
    # Catch-all: every alert not matched above goes to OnCall, whatever its
    # severity. OnCall's escalation chains decide what pages someone.
    grafana_cloud_operator_own_catchall_route: >-
      {{ {'receiver': receiver_name | trim} }}
    grafana_cloud_operator_own_routes: >-
      {{ [
              {
                'receiver': receiver_name | trim,
                'group_by': [
                    "alertname",
                    "name"
                  ],
                'match': {
                  'alertname': 'ArgoCDSyncAlert'
                }
              },
              {
                'receiver': receiver_name | trim,
                'group_by': [
                    "alertname",
                    "name"
                  ],
                'match': {
                  'alertname': 'ArgocdServiceUnhealthy'
                }
              },
              {
                'receiver': receiver_name | trim,
                'group_by': [
                    "alertname",
                    "pod"
                  ],
                'match': {
                  'alertname': 'KubePodCrashLooping'
                }
              },
              {
                "match": {
                  "alertname": "Watchdog"
                },
                "receiver": "grafana-oncall-heartbeat",
                "group_wait": "0s",
                "group_interval": "1m",
                "repeat_interval": "50s"
              }
            ] }}

- name: Split existing routes into pass-through and other routes
  ansible.builtin.set_fact:
    grafana_cloud_operator_existing_routes: "{{ _routes }}"
    grafana_cloud_operator_passthrough_routes: "{{ _routes | selectattr('continue', 'defined') | selectattr('continue', 'equalto', true) | list }}"
  vars:
    _own_names: "{{ grafana_cloud_operator_own_receivers | map(attribute='name') | list }}"
    _all_routes: "{{ (grafana_cloud_operator_alertmanager_base.route | default({})).routes | default([], true) }}"
    _routes: >-
      {{ _all_routes | reject('in', _all_routes | selectattr('receiver', 'defined') | selectattr('receiver', 'in', _own_names) | list) | list }}

- name: Decode and modify alertmanager secret configuration
  ansible.builtin.set_fact:
    grafana_cloud_operator_modified_alertmanager_secret_content: >-
      {{ grafana_cloud_operator_alertmanager_base | combine({
          'receivers': (grafana_cloud_operator_alertmanager_base.receivers | default([], true)
                        | rejectattr('name', 'in', _own_names) | list) + grafana_cloud_operator_own_receivers,
          'route': (grafana_cloud_operator_alertmanager_base.route | default({}, true)) | combine({
              'receiver': receiver_name | trim,
              'group_by': ['namespace', 'alertname'],
              'routes': grafana_cloud_operator_passthrough_routes
                        + grafana_cloud_operator_own_routes
                        + (grafana_cloud_operator_existing_routes | reject('in', grafana_cloud_operator_passthrough_routes) | list)
                        + [grafana_cloud_operator_own_catchall_route]
          })
      }) }}
  vars:
    _own_names: "{{ grafana_cloud_operator_own_receivers | map(attribute='name') | list }}"

- name: Update CR status to AlertmanagerConfigModified
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: grafanacloud.stakater.com/v1alpha1
      kind: Config
      metadata:
        name: "{{ grafana_cloud_operator_cr_name }}"
        namespace: "{{ grafana_cloud_operator_cr_namespace }}"
      status:
        conditions:
          - lastTransitionTime: "{{ grafana_cloud_operator_ansible_date_time.iso8601 }}"
            status: 'True'
            type: "Processing"
            reason: "AlertmanagerConfigModified"
            message: "Decoded and modified the alertmanager secret configuration"

- name: Re-encode modified alertmanager content for cluster
  ansible.builtin.set_fact:
    grafana_cloud_operator_encoded_alertmanager_secret_content: "{{ grafana_cloud_operator_modified_alertmanager_secret_content | to_nice_yaml | b64encode }}"
  vars:
    provision_mode_check: "{{ provision_mode }}"
  when: provision_mode_check == "hubAndSpoke"

- name: Create a new ManifestWork for each cluster to patch alertmanager-main secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: work.open-cluster-management.io/v1
      kind: ManifestWork
      metadata:
        name: "{{ transformed_namespace }}-manifestwork-grafana-oncall"
        namespace: "{{ transformed_namespace }}"
      spec:
        workload:
          manifests:
            - apiVersion: v1
              kind: Secret
              metadata:
                name: alertmanager-main
                namespace: openshift-monitoring
              data:
                alertmanager.yaml: "{{ grafana_cloud_operator_encoded_alertmanager_secret_content }}"
  vars:
    provision_mode_check: "{{ provision_mode }}"
  when:
    - provision_mode_check == "hubAndSpoke"
    - grafana_cloud_operator_create_integration_for | length > 0
  register: grafana_cloud_operator_manifestwork_creation_results
